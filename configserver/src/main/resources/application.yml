spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "git@github.com:Kirlmen/msconfig.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
          private-key: ${CONFIG_SERVER_GIT_PRIVATE_KEY}
          ignoreLocalSshSettings: true

encrypt:
  key: ${CONFIG_SERVER_ENCRYPT_KEY}

server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
